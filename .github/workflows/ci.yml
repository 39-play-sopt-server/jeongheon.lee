name: CI

on:
  pull_request:
    branches: [main] # main으로 보내는 PR을 검사
  workflow_call: # CD에서도 같은 테스트·빌드를 먼저 실행할 수 있게 해요

permissions:
  contents: read # 저장소 소스를 읽는 권한만 사용

jobs:
  build:
    runs-on: ubuntu-latest # GitHub가 제공하는 Ubuntu에서 실행
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: Java 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle # 내려받은 의존성을 재사용하여 빌드 시간을 단축

      - name: 테스트 및 빌드
        # 기존 결과를 지우고 테스트 및 실행 JAR 생성을 수행
        # 실패하면 CI가 실패하므로 CD도 실행되지 않음
        run: bash ./gradlew clean test bootJar --no-daemon
