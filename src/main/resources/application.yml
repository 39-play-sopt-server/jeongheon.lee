app:
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true} # 로컬 HTTP에서는 false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000} # 환경변수가 없으면 로컬 프론트엔드 주소를 사용

spring:
  application:
    name: assignment

  datasource:
    url: jdbc:mysql://localhost:3306/assignment?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)
